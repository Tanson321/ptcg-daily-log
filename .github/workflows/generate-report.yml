name: Generate PTCG Report

on:
  workflow_dispatch:
    inputs:
      range:
        description: "today, date, week, or period"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - date
          - week
          - period
      date:
        description: "YYYY-MM-DD. Used by date and week. Week uses the Monday-Sunday week containing this date."
        required: false
        type: string
      start_date:
        description: "YYYY-MM-DD. Used by period."
        required: false
        type: string
      end_date:
        description: "YYYY-MM-DD. Used by period."
        required: false
        type: string

  schedule:
    # 毎週日曜 23:50 JST = 日曜 14:50 UTC
    - cron: "50 14 * * 0"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Discord logs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run fetch:week
          else
            node scripts/fetch-today.js \
              --range="${{ github.event.inputs.range }}" \
              --date="${{ github.event.inputs.date }}" \
              --start-date="${{ github.event.inputs.start_date }}" \
              --end-date="${{ github.event.inputs.end_date }}"
          fi

      - name: Generate post
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run generate:week
          else
            node scripts/generate-post.js \
              --range="${{ github.event.inputs.range }}" \
              --date="${{ github.event.inputs.date }}" \
              --start-date="${{ github.event.inputs.start_date }}" \
              --end-date="${{ github.event.inputs.end_date }}"
          fi

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add logs posts

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "generate ptcg report"
            git push
          fi

      - name: Notify Discord
        if: success()
        run: |
          FILE="$(ls -t posts/*.md | head -n 1)"

          FILENAME="$(basename "$FILE")"
          CMS_URL="http://ptcg-daily-log.vercel.app/posts/$FILENAME"

          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🧠 下書きが生成されたよ\n\n対象: $FILENAME\n編集: $CMS_URL\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

name: Generate PTCG Report

on:
  workflow_dispatch:
    inputs:
      range:
        description: "today, date, week, or period"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - date
          - week
          - period
      date:
        description: "YYYY-MM-DD. Used by date and week. Week uses the Monday-Sunday week containing this date."
        required: false
        type: string
      start_date:
        description: "YYYY-MM-DD. Used by period."
        required: false
        type: string
      end_date:
        description: "YYYY-MM-DD. Used by period."
        required: false
        type: string

  schedule:
    # 毎日 23:50 JST = 14:50 UTC
    # 日曜は同じ実行で日次と週次の両方を下書き化する
    - cron: "50 14 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve generation targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # GitHub Actions の schedule は遅延することがあるため、
            # 実行時刻そのものではなく「6時間前のJST日付」を締め対象日にする。
            target_info="$(node -e '
              const target = new Date(Date.now() - 6 * 60 * 60 * 1000);
              const date = new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Tokyo",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).format(target);
              const weekdayName = new Intl.DateTimeFormat("en-US", {
                timeZone: "Asia/Tokyo",
                weekday: "short",
              }).format(target);
              const weekdayMap = {
                Mon: 1,
                Tue: 2,
                Wed: 3,
                Thu: 4,
                Fri: 5,
                Sat: 6,
                Sun: 7,
              };
              console.log(`${date} ${weekdayMap[weekdayName]}`);
            '
            )"
            read -r target_date weekday <<< "$target_info"
            ranges="date"

            if [ "$weekday" = "7" ]; then
              ranges="${ranges}"$'\n'"week"
            fi

            {
              echo "ranges<<EOF"
              printf '%s\n' "$ranges"
              echo "EOF"
              echo "date=$target_date"
              echo "start_date="
              echo "end_date="
            } >> "$GITHUB_OUTPUT"

            echo "target date: $target_date"
            printf 'target ranges:\n%s\n' "$ranges"
          else
            {
              echo "ranges<<EOF"
              echo "${{ github.event.inputs.range }}"
              echo "EOF"
              echo "date=${{ github.event.inputs.date }}"
              echo "start_date=${{ github.event.inputs.start_date }}"
              echo "end_date=${{ github.event.inputs.end_date }}"
            } >> "$GITHUB_OUTPUT"

            echo "manual range: ${{ github.event.inputs.range }}"
          fi

      - name: Fetch Discord logs
        env:
          TARGET_RANGES: ${{ steps.targets.outputs.ranges }}
          TARGET_DATE: ${{ steps.targets.outputs.date }}
          TARGET_START_DATE: ${{ steps.targets.outputs.start_date }}
          TARGET_END_DATE: ${{ steps.targets.outputs.end_date }}
        run: |
          while IFS= read -r range; do
            if [ -z "$range" ]; then
              continue
            fi

            echo "Fetching Discord logs: range=$range date=$TARGET_DATE start=$TARGET_START_DATE end=$TARGET_END_DATE"
            node scripts/fetch-today.js \
              --range="$range" \
              --date="$TARGET_DATE" \
              --start-date="$TARGET_START_DATE" \
              --end-date="$TARGET_END_DATE"
          done <<< "$TARGET_RANGES"

      - name: Generate post
        env:
          TARGET_RANGES: ${{ steps.targets.outputs.ranges }}
          TARGET_DATE: ${{ steps.targets.outputs.date }}
          TARGET_START_DATE: ${{ steps.targets.outputs.start_date }}
          TARGET_END_DATE: ${{ steps.targets.outputs.end_date }}
        run: |
          while IFS= read -r range; do
            if [ -z "$range" ]; then
              continue
            fi

            echo "Generating post: range=$range date=$TARGET_DATE start=$TARGET_START_DATE end=$TARGET_END_DATE"
            node scripts/generate-post.js \
              --range="$range" \
              --date="$TARGET_DATE" \
              --start-date="$TARGET_START_DATE" \
              --end-date="$TARGET_END_DATE"
          done <<< "$TARGET_RANGES"

      - name: Commit generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add logs posts
          post_files="$(git diff --cached --name-only -- posts || true)"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            {
              echo "changed=true"
              echo "post_files<<EOF"
              printf '%s\n' "$post_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            git commit -m "generate ptcg report"
            git push
          fi

      - name: Notify Discord
        if: success() && steps.commit.outputs.changed == 'true' && steps.commit.outputs.post_files != ''
        env:
          POST_FILES: ${{ steps.commit.outputs.post_files }}
        run: |
          payload="$(
            POST_FILES="$POST_FILES" node <<'NODE'
          const files = (process.env.POST_FILES ?? "")
            .split(/\r?\n/)
            .map((file) => file.trim())
            .filter(Boolean);

          const formatter = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          });

          function addDays(date, days) {
            const next = new Date(date);
            next.setUTCDate(next.getUTCDate() + days);
            return next;
          }

          function periodLabel(filename) {
            const weekly = filename.match(/^(\d{4}-\d{2}-\d{2})-week\.md$/);

            if (weekly) {
              const start = new Date(`${weekly[1]}T00:00:00+09:00`);
              return `${formatter.format(start)}〜${formatter.format(addDays(start, 6))}`;
            }

            const period = filename.match(
              /^(\d{4}-\d{2}-\d{2})_to_(\d{4}-\d{2}-\d{2})\.md$/,
            );

            if (period) {
              return `${period[1]}〜${period[2]}`;
            }

            const daily = filename.match(/^(\d{4}-\d{2}-\d{2})\.md$/);

            return daily ? daily[1] : "";
          }

          const lines = ["🧠 下書きが生成されたよ", ""];

          for (const file of files) {
            const filename = file.split("/").pop();
            const cmsUrl = `https://ptcg-daily-log.vercel.app/posts/${filename}`;
            const period = periodLabel(filename);

            lines.push(`対象: ${filename}`);

            if (period) {
              lines.push(`範囲: ${period}`);
            }

            lines.push(`編集: ${cmsUrl}`, "");
          }

          process.stdout.write(JSON.stringify({ content: lines.join("\n") }));
          NODE
          )"

          curl -H "Content-Type: application/json" \
            -d "$payload" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
